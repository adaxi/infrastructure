---
# Use the GUI and go to "YourNodeName -> System -> Network -> Create -> Linux Bridge".
# Use as "Name" the value "vmbr0", as "IPv4/CIDR" the IP and subnet your server should get (for example "192.168.0.2/24"),
# for "Gateway (IPv4)" the IP of your Router (for example "192.168.0.1"),
# set the "Autostart" checkbox and use the value "enp8s0" for the field "Bridge ports".

- name: Create image directory
  ansible.builtin.file:
    path: /proxmox-images
    state: directory

- name: Create dummy vm directory
  ansible.builtin.file:
    path: /volumes/images/999
    state: directory

- name: Download Home Assistant
  block:
    - name: Download Home Assistant (get_url)
      ansible.builtin.get_url:
        url: https://github.com/home-assistant/operating-system/releases/download/10.5/haos_ova-10.5.qcow2.xz
        dest: /proxmox-images/home-assistant.qcow2.xz
        mode: '0440'
  rescue:
    # Older ansible-core (< 2.17) fails on Python 3.12+ remotes with
    # "HTTPSConnection.__init__() got an unexpected keyword argument 'cert_file'".
    # Fall back to curl, which does not go through Ansible's urllib wrapper.
    - name: Download Home Assistant (curl fallback)  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: >-
          curl -fsSL
          https://github.com/home-assistant/operating-system/releases/download/10.5/haos_ova-10.5.qcow2.xz
          -o /proxmox-images/home-assistant.qcow2.xz
        creates: /proxmox-images/home-assistant.qcow2.xz

    - name: Ensure Home Assistant image permissions
      ansible.builtin.file:
        path: /proxmox-images/home-assistant.qcow2.xz
        mode: '0440'

- name: Unarchive Home Assistant
  ansible.builtin.shell:
    cmd: xzcat /proxmox-images/home-assistant.qcow2.xz > /volumes/images/999/home-assistant.qcow2
    creates: /volumes/images/999/home-assistant.qcow2
  changed_when: true

- name: Create home assistant virtual machine (Please create "vmbr0" in GUI when skipped)
  proxmox_kvm:
    proxmox_default_behavior: no_defaults
    validate_certs: no
    api_user: adaxi@pam
    api_password: "{{ proxmox_password }}"
    api_host: localhost
    name: homeassistant
    node: slag
    vmid: 100
    state: present
    vcpus: 2
    memory: 2048
    bios: ovmf
    autostart: true
    scsihw: virtio-scsi-single
    net:
      net0: "virtio,bridge=vmbr0"
    scsi:
      sata0: "local:0,import-from=localdir:999/home-assistant.qcow2,format=qcow2"
  when: '"vmbr0" in ansible_facts.interfaces'

- name: Start home assistant
  proxmox_kvm:
    proxmox_default_behavior: no_defaults
    validate_certs: no
    api_user: adaxi@pam
    api_password: "{{ proxmox_password }}"
    api_host: localhost
    name: homeassistant
    node: slag
    vmid: 100
    state: started
