---
- name: Install numix theme and install circle icon theme
  ansible.builtin.apt:
    name:
      - numix-icon-theme-circle
      - numix-gtk-theme
      - gnome-tweaks
    state: present
  become: yes

- name: Create dconf cache dir
  become: yes
  become_user: "{{ ansible_user_id }}"
  ansible.builtin.file:
    path: "~/.cache/dconf"
    state: directory
    owner: "{{ ansible_user_id }}"
    mode: '0775'

- name: Install dependencies for gsettings
  ansible.builtin.apt:
    name: dbus-x11
    state: present
  become: yes

- name: Look up the desktop user's uid (for the session D-Bus address)
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user_id }}"

- name: Compute the session D-Bus address
  ansible.builtin.set_fact:
    gnome_session_dbus: "unix:path=/run/user/{{ ansible_facts.getent_passwd[ansible_user_id][1] }}/bus"

- name: Set icons to numix circle+
  become: yes
  become_user: "{{ ansible_user_id }}"
  environment:
    DBUS_SESSION_BUS_ADDRESS: "{{ gnome_session_dbus }}"
  gsettings:
    key: org.gnome.desktop.interface.icon-theme
    value: Numix-Circle

