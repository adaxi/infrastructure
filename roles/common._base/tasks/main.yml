---
- name: Remove legacy contrib/non-free repository line (pre non-free-firmware)
  ansible.builtin.apt_repository:
    repo: 'deb http://httpredir.debian.org/debian {{ ansible_distribution_release }} contrib non-free'
    state: absent
  become: yes
  when: ansible_distribution == 'Debian'

- name: Add contrib and non-free section to debian repositories
  ansible.builtin.apt_repository:
    repo: 'deb http://httpredir.debian.org/debian {{ ansible_distribution_release }} contrib non-free non-free-firmware'
    state: present
  become: yes
  when: ansible_distribution == 'Debian'

- name: Install debconf, debconf utils and git required for ansible deployment
  ansible.builtin.apt:
    name:
      - sudo
      - curl
      - unzip
      - debconf
      - debconf-utils
      - git
      - apt-transport-https
      - dnsutils
    state: present
    update_cache: yes
  become: yes

- name: Add root bashrc
  ansible.builtin.copy:
    src: bashrc
    dest: /root/.bashrc
    mode: '0644'
  become: yes
  when: ansible_distribution == 'Debian'
