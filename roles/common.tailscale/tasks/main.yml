- name: Download Tailscale GPG key
  block:
    - name: Download Tailscale GPG key (get_url)
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: '0644'
      become: yes
  rescue:
    # Older ansible-core (< 2.17) fails on Python 3.12+ remotes with
    # "HTTPSConnection.__init__() got an unexpected keyword argument 'cert_file'".
    # Fall back to curl, which does not go through Ansible's urllib wrapper.
    - name: Download Tailscale GPG key (curl fallback)  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: >-
          curl -fsSL
          https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg
          -o /usr/share/keyrings/tailscale-archive-keyring.gpg
        creates: /usr/share/keyrings/tailscale-archive-keyring.gpg
      become: yes

    - name: Ensure Tailscale GPG key permissions
      ansible.builtin.file:
        path: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: '0644'
      become: yes

- name: Remove legacy unsigned Tailscale repository line
  ansible.builtin.apt_repository:
    repo: "deb https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} main"
    state: absent
  become: yes

- name: Add Tailscale APT repository with signed-by
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} main"
    state: present
    filename: 'tailscale'
  become: yes

- name: Add APT pinning for Tailscale repository
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/tailscale
    content: |
      Package: tailscale
      Pin: origin pkgs.tailscale.com
      Pin-Priority: 1001
  become: yes

- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: "present"
  become: yes
