---
# Name of the remote inside rclone.conf. Must match the remote name used when
# the config was generated (see googledrive_rclone_conf_path below).
googledrive_remote_name: GoogleDrive

# Directory (inside the desktop user's home) under which the per-folder mount
# points are created.
googledrive_mount_base: "/home/{{ ansible_user_id }}/GoogleDrive"

# Which Google Drive folders to mount, and the local directory name to mount
# each one under. Each entry is mounted as its own rclone remote path, so only
# these folders are exposed - not the whole drive.
googledrive_mounts:
  - remote_path: Documents
    local_dir: Documents
  - remote_path: Photos
    local_dir: Photos

# Path (relative to the playbook directory) to an rclone.conf that already
# contains the "{{ googledrive_remote_name }}" remote. rclone's Google Drive
# OAuth flow needs a browser, so this file can't be generated by Ansible: run
# `rclone config` locally once to create the "{{ googledrive_remote_name }}"
# remote, then copy the resulting rclone.conf here before running the
# playbook. Never commit it.
googledrive_rclone_conf_path: "env/{{ installation_environment }}/keys/rclone.conf"

# Extra flags appended to `rclone mount`.
googledrive_mount_extra_args: "--vfs-cache-mode writes --dir-cache-time 1h"
